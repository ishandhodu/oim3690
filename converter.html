<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Temperature Converter - Ishan Dhodapkar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <h1>Temperature Converter</h1>
  </header>

  <main>
    <form id="converter-form">
      <label for="celsius-input">Celsius</label>
      <input type="number" id="celsius-input" name="celsius-input" placeholder="Enter temperature in °C" required>
      <button type="submit">Convert to Fahrenheit</button>
    </form>

    <p id="result"></p>
  </main>

  <footer>
    <p>&copy; 2026 Ishan Dhodapkar</p>
  </footer>

  <script>
    function toFahrenheit(celsius) {
      return (celsius * 9) / 5 + 32;
    }

    const form = document.getElementById('converter-form');
    const celsiusInput = document.getElementById('celsius-input');
    const result = document.getElementById('result');

    form.addEventListener('submit', (event) => {
      event.preventDefault();
      const celsius = parseFloat(celsiusInput.value);
      const fahrenheit = toFahrenheit(celsius);
      result.textContent = `${celsius}°C is ${fahrenheit}°F`;
    });
  </script>

</body>
</html>
