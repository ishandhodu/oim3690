<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fetch Something Fun - Ishan Dhodapkar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <h1>Fetch Something Fun</h1>
  </header>

  <main>
    <p class="intro">
      Press the button to fetch a random Pokémon from the
      <a href="https://pokeapi.co">PokéAPI</a>.
    </p>

    <button type="button" id="fetch-btn">Get a random Pokémon</button>

    <p id="status" role="status" aria-live="polite"></p>

    <figure id="result" hidden>
      <img id="sprite" src="" alt="" width="192" height="192">
      <figcaption id="name"></figcaption>
    </figure>
  </main>

  <footer>
    <p>&copy; 2026 Ishan Dhodapkar</p>
  </footer>

  <script>
    // PokéAPI has Pokémon with ids 1 to 1025.
    const MAX_ID = 1025;

    async function getRandomPokemon() {
      const id = Math.floor(Math.random() * MAX_ID) + 1;
      const response = await fetch(`https://pokeapi.co/api/v2/pokemon/${id}`);
      // fetch does not throw on a 404, so check response.ok myself.
      if (!response.ok) {
        throw new Error(`PokéAPI answered ${response.status}`);
      }
      const data = await response.json();
      console.log(data);
      // The fields this page reads: name and sprites.front_default.
      return { name: data.name, sprite: data.sprites.front_default };
    }

    const button = document.querySelector("#fetch-btn");
    const status = document.querySelector("#status");
    const result = document.querySelector("#result");
    const sprite = document.querySelector("#sprite");
    const nameEl = document.querySelector("#name");

    button.addEventListener("click", async () => {
      button.disabled = true;
      status.textContent = "Catching one...";
      try {
        const pokemon = await getRandomPokemon();
        nameEl.textContent = pokemon.name;
        sprite.src = pokemon.sprite || "";
        sprite.alt = pokemon.name;
        sprite.hidden = !pokemon.sprite;
        result.hidden = false;
        status.textContent = "";
      } catch (error) {
        result.hidden = true;
        status.textContent = "Could not fetch a Pokémon: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
