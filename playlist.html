<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playlist - Ishan Dhodapkar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    #song-count {
      font-size: 0.9rem;
      opacity: 0.75;
      margin: 0 0 var(--space-2);
    }

    #playlist li {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: var(--space-2);
    }

    .remix {
      color: var(--color-rust);
      font-weight: 600;
    }

    .remove-btn {
      font-size: 0.8rem;
      padding: 0.2rem 0.6rem;
      background: transparent;
      color: var(--color-ink);
      border: 1px solid var(--color-line);
    }

    .remove-btn:hover {
      background: var(--color-rust);
      color: #fff;
      border-color: var(--color-rust);
    }
  </style>
</head>
<body>

  <header>
    <h1>Playlist</h1>
  </header>

  <main>
    <form id="add-song-form">
      <label for="song-input">Add a song</label>
      <input type="text" id="song-input" name="song-input" placeholder="Song title" required>
      <button type="submit">Add song</button>
    </form>

    <p id="song-count"></p>
    <ul id="playlist"></ul>
  </main>

  <footer>
    <p>&copy; 2026 Ishan Dhodapkar</p>
  </footer>

  <script src="js/playlist.js"></script>

</body>
</html>
