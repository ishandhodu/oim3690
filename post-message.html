<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Message Board - Ishan Dhodapkar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <header>
    <h1>Message Board</h1>
  </header>

  <main>
    <p class="intro">
      Type a message and post it to the class message board.
    </p>

    <form id="message-form" novalidate>
      <label for="message">Message</label>
      <textarea id="message" rows="4" placeholder="Hello from Ishan!"></textarea>

      <button type="submit" id="post-btn">Post Message</button>
    </form>

    <p id="status" role="status" aria-live="polite"></p>
  </main>

  <footer>
    <p>&copy; 2026 Ishan Dhodapkar</p>
  </footer>

  <script>
    // Sends one message to the class board. The token is my GitHub username.
    async function postMessage(text) {
      const response = await fetch("https://oim.zhili.dev/message", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "X-Token": "ishandhodu"
        },
        body: JSON.stringify({ message: text })
      });
      const data = await response.json();
      console.log(data);
      // fetch does not throw on a 400 or 500, so check response.ok myself.
      if (!response.ok) {
        throw new Error(data.error || `Server answered ${response.status}`);
      }
      return data;
    }

    const form = document.querySelector("#message-form");
    const input = document.querySelector("#message");
    const button = document.querySelector("#post-btn");
    const status = document.querySelector("#status");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const text = input.value.trim();

      // Refuse an empty message before sending anything.
      if (text === "") {
        status.textContent = "Type a message first.";
        return;
      }

      // Turn the button off so a second click cannot post twice.
      button.disabled = true;
      status.textContent = "Posting...";
      try {
        await postMessage(text);
        status.textContent = "Posted!";
        input.value = "";
      } catch (error) {
        status.textContent = "Could not post: " + error.message;
      } finally {
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
