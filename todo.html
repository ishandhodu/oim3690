<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do - Ishan Dhodapkar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/todo.css">
</head>
<body>

  <header>
    <h1>To-Do List</h1>
  </header>

  <main>
    <form id="todo-form">
      <label for="todo-input">New task</label>
      <input type="text" id="todo-input" name="todo-input" placeholder="What do you need to do?" required>
      <button type="submit">Add Task</button>
    </form>

    <div class="filters">
      <button type="button" class="filter-btn active" data-filter="all">All</button>
      <button type="button" class="filter-btn" data-filter="open">Open</button>
      <button type="button" class="filter-btn" data-filter="done">Done</button>
    </div>

    <ul id="todo-list"></ul>
  </main>

  <footer>
    <p>&copy; 2026 Ishan Dhodapkar</p>
  </footer>

  <script src="js/todo.js"></script>
</body>
</html>
